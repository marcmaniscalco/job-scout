version = 0.1

[default.deploy.parameters]
stack_name = "job-scout"
resolve_s3 = true
s3_prefix = "job-scout"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
disable_rollback = false
parameter_overrides = "ResumeObjectKey=resume.docx"

[default.build.parameters]
use_container = true

[default.sync.parameters]
watch = true
