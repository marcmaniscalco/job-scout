[project]
name = "job-scout"
version = "0.1.0"
description = "SQS-triggered Lambda that scores job descriptions for fit against a resume using AWS Bedrock."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "moto[dynamodb,s3,sqs]>=5.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    # Needed locally to use the "aws login" (browser-based root/IAM
    # Identity Center-less) credential provider from scripts/*.py.
    # Not needed by the deployed Lambda, which uses its execution
    # role's container credential provider instead — dev-only.
    "botocore[crt]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_scout"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --cov=job_scout --cov-report=term-missing"
